<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="CD Library app icon with musical note"
>
  <!-- Colors (3 total):
       1) #0D47A1 - dark blue
       2) #90CAF9 - light blue
       3) #FFFFFF - white
  -->

  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#0D47A1" />

  <!-- Desktop screen -->
  <rect x="7" y="8" width="14" height="11" rx="2" fill="#90CAF9" />
  <rect x="11" y="20" width="6" height="2" rx="1" fill="#FFFFFF" />
  <rect x="10" y="22" width="8" height="1.5" rx="0.75" fill="#90CAF9" />

  <!-- Phone (overlapping, to show mobile) -->
  <rect x="17" y="9" width="8" height="13" rx="2" fill="#FFFFFF" />
  <rect x="18" y="10.5" width="6" height="9.5" rx="1" fill="#90CAF9" />
  <circle cx="21" cy="21.5" r="0.6" fill="#90CAF9" />

  <!-- CD disc -->
  <circle cx="11" cy="24.5" r="3" fill="#FFFFFF" />
  <circle cx="11" cy="24.5" r="1.1" fill="#90CAF9" />

  <!-- Beamed double musical note (yellow) -->
  <!-- Note heads -->
  <ellipse cx="13.0" cy="24.2" rx="1.45" ry="0.9" transform="rotate(-12 13.0 24.2)" fill="#FFD600" />
  <ellipse cx="17.7" cy="23.6" rx="1.45" ry="0.9" transform="rotate(-8 17.7 23.6)"  fill="#FFD600" />

  <!-- Stems -->
    <rect x="18.5" y="18.6" width="0.6" height="5.2" fill="#FFD600" />
    <rect x="13.8" y="18.6" width="0.6" height="5.6" fill="#FFD600" />

  <!-- Beam -->
    <rect x="13.8" y="18.6" width="4.8" height="0.9" fill="#FFD600" />
</svg>
